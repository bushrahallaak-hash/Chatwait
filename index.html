<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>Chatwait</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;height:100vh;display:flex;flex-direction:column}
header{height:60px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
button{border:0;background:#eee;border-radius:14px;padding:10px 14px;font-size:15px}#chat{flex:1;overflow:auto;padding:20px 14px}.msg{max-width:850px;margin:12px auto;padding:14px 16px;border-radius:18px;line-height:1.7}.user{background:#f0f0f0}.ai{background:#fafafa;border:1px solid #eee}
footer{padding:10px;border-top:1px solid #ddd;display:flex;gap:8px;max-width:900px;width:100%;margin:auto}input{flex:1;border:1px solid #ccc;border-radius:22px;padding:13px 16px;font-size:16px;outline:none}
.dark{background:#111;color:#eee}.dark header,.dark footer{border-color:#333}.dark button{background:#222;color:#eee}.dark input{background:#181818;color:#eee;border-color:#444}.dark .user{background:#252525}.dark .ai{background:#151515;border-color:#333}
</style></head>
<body>
<header><button onclick="toggle()">☾</button><b>Chatwait</b><button onclick="newChat()">＋</button></header>
<main id="chat"><div class="msg ai">مرحباً! 👋 أنا Chatwait. اكتب رسالتك لنبدأ.</div></main>
<footer><input id="input" placeholder="اسأل Chatwait..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">إرسال</button></footer>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function send(){let v=input.value.trim();if(!v)return;add(v,'user');input.value='';setTimeout(()=>add('أنا نسخة Chatwait التجريبية. لربط الذكاء الاصطناعي الحقيقي وتوليد الصور والفيديو نحتاج خدمة AI وواجهة خلفية.','ai'),350)}
function newChat(){chat.innerHTML='<div class="msg ai">محادثة جديدة ✨</div>'}
function toggle(){document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')}
if(localStorage.dark==='true')document.body.classList.add('dark')
</script></body></html>
